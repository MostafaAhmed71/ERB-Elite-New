    <title>أولمبياد النخبة 1448 هــ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      /* منع وميض الثيم الخاطئ — يُنفَّذ قبل تحميل React */
      (function () {
        try {
          var key = 'erb-elite-theme';
          var pref = localStorage.getItem(key) || 'dark';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#162e54' : '#F7F9FC');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev only: stale Workbox on localhost caches React/Vite modules → Invalid hook call + WS 400
      (function () {
        var h = location.hostname;
        if (h !== 'localhost' && h !== '127.0.0.1') return;
        if (!('serviceWorker' in navigator)) return;
        var flag = 'erb_sw_dev_cleared';
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var had = regs.length > 0 || !!navigator.serviceWorker.controller;
          return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            if (!('caches' in window)) return had;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () { return had; });
          });
        }).then(function (had) {
          if (had && !sessionStorage.getItem(flag)) {
            sessionStorage.setItem(flag, '1');
            location.reload();
          }
        }).catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
