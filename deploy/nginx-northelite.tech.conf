# ERB Elite — northelite.tech (SPA + PWA)
# Copy to: /etc/nginx/sites-available/northelite.tech
# Enable: ln -sf /etc/nginx/sites-available/northelite.tech /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name northelite.tech www.northelite.tech;
    root /var/www/northelite.tech;
    index index.html;

    # Certbot will add SSL — or run: certbot --nginx -d northelite.tech -d www.northelite.tech
    location /.well-known/acme-challenge/ {
        root /var/www/northelite.tech;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
