# wpp.northelite0.com — reverse proxy إلى خادم واتساب (Node :3001)

docRoot                   /var/www/wpp-proxy
indexFiles                index.html

enableScript              0

extprocessor wpp_node {
  type                    proxy
  address                 127.0.0.1:3001
  maxConns                50
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 wpp_node
  addDefaultCharset       off
}

context /.well-known/acme-challenge/ {
  allowBrowse             1
  location                /var/www/wpp-proxy/.well-known/acme-challenge/
}
