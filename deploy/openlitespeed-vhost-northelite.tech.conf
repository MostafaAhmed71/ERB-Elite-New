# ERB Elite — northelite.tech على OpenLiteSpeed (SPA ثابتة)
# انسخ إلى: /usr/local/lsws/conf/vhosts/northelite.tech/vhost.conf
# ثم أعد تشغيل LiteSpeed

docRoot                   /var/www/northelite.tech
indexFiles                index.html

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

# مهم: لا تستخدم Node.js لهذا الموقع — ملفات ثابتة فقط
enableScript              0

rewrite  {
  enable                  1
  inherit                 1
  autoLoadHtaccess        1
}

context /.well-known/acme-challenge/ {
  allowBrowse             1
  location                /var/www/northelite.tech/.well-known/acme-challenge/
}

context / {
  allowBrowse             1
  indexFiles              index.html
}

context /sw.js {
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
    Cache-Control no-cache, no-store, must-revalidate
  END_extraHeaders
}
